name: Stress examples

on:
  push:
  workflow_dispatch:

jobs:
  stress:
    name: Stress (Node.js v${{ matrix.nodejs }} ${{ matrix.flags }})
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - nodejs: 24.22.1
            flags: ''
          # Optimizes every function but those named `aggregate`, with both of
          # V8's optimizing compilers.
          - nodejs: 24.22.1
            flags: --maglev-filter=-aggregate --turbo-filter=-aggregate
          - nodejs: 24.22.1
            flags: --no-use-osr
          - nodejs: 24.22.1
            flags: --no-maglev-osr
          - nodejs: 24.22.1
            flags: --no-concurrent-osr
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/examples/input/*

      - uses: ./.github/actions/example-inputs

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.nodejs }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          cache: true
          run_install: true

      - name: Stress the Clang diff example
        run: node ${{ matrix.flags }} scripts/update-examples/stress.ts 120
