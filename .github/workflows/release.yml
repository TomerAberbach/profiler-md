name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          cache: true
          run_install: true

      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    name: Bump the Homebrew formula
    needs: publish
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Read the tarball URL from the tag
        id: tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "url=https://registry.npmjs.org/profiler-md/-/profiler-md-$version.tgz" >> "$GITHUB_OUTPUT"

      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: profiler-md
          formula-path: Formula/profiler-md.rb
          homebrew-tap: TomerAberbach/homebrew-tap
          push-to: TomerAberbach/homebrew-tap
          create-pullrequest: false
          download-url: ${{ steps.tarball.outputs.url }}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
