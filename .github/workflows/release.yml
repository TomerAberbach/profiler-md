name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          cache: true
          run_install: true

      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    name: Bump the Homebrew formula
    needs: publish
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Read the tarball URL from the tag
        id: tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "url=https://registry.npmjs.org/profiler-md/-/profiler-md-$version.tgz" >> "$GITHUB_OUTPUT"

      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: profiler-md
          formula-path: Formula/profiler-md.rb
          homebrew-tap: TomerAberbach/homebrew-tap
          push-to: TomerAberbach/homebrew-tap
          create-pullrequest: false
          download-url: ${{ steps.tarball.outputs.url }}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
