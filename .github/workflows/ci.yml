name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks whose outcome is the same on every platform run once, so they don't
  # compete with the tests for the matrix runners' cores.
  static:
    name: Static checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Skips the example inputs except those `check-demo` converts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/examples/input/*
            /examples/input/javascript.node.*.cpuprofile

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          cache: true
          run_install: true

      # Stops the checks before the job's `timeout-minutes`, leaving time for
      # the steps above, so `check.ts` prints a hung step's output. A job
      # timeout kills the process without it.
      - name: Check
        run: pnpm check:static --timeout-minutes 12

  test:
    name: Tests (Node.js v${{ matrix.nodejs }}, ${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        nodejs: [22.18.0, 24]
        os: [ubuntu-latest, macOS-latest]
      fail-fast: false
    steps:
      # Skips the example inputs, which the next step restores from the cache.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/examples/input/*

      - uses: ./.github/actions/example-inputs

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.nodejs }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          cache: true
          run_install: true

      - name: Test
        run: pnpm test --run

  # Runs beside the tests instead of after them. Ubuntu only, so a run holds
  # no more macOS runners than the test matrix does.
  examples:
    name: Example checks (Node.js v${{ matrix.nodejs }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        nodejs: [22.18.0, 24]
      fail-fast: false
    steps:
      # Skips the example inputs, which the next step restores from the cache.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/examples/input/*

      - uses: ./.github/actions/example-inputs

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.nodejs }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          cache: true
          run_install: true

      - name: Check examples
        run: pnpm check-examples

      - name: Check diff matching
        run: pnpm check-diff-matching

      - name: Check input privacy
        if: matrix.nodejs == 24
        run: pnpm check-input-privacy
