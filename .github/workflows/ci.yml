name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks whose outcome is the same on every platform run once, so they don't
  # compete with the tests for the matrix runners' cores.
  static:
    name: Static checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Skips the example inputs except those `check-demo` converts.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/examples/input/*
            /examples/input/javascript.node.*.cpuprofile

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          cache: true
          run_install: true

      - name: Check
        run: pnpm check:static

  test:
    name: Tests (Node.js v${{ matrix.nodejs }}, ${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        nodejs: [22, 24]
        os: [ubuntu-latest, macOS-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.nodejs }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          cache: true
          run_install: true

      - name: Test
        run: pnpm test --run

  # Runs beside the tests instead of after them. Ubuntu only, so a run holds
  # no more macOS runners than the test matrix does.
  examples:
    name: Example checks (Node.js v${{ matrix.nodejs }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        nodejs: [22, 24]
      fail-fast: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.nodejs }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          cache: true
          run_install: true

      - name: Check examples
        run: pnpm check-examples

      - name: Check diff matching
        run: pnpm check-diff-matching

      - name: Check input privacy
        if: matrix.nodejs == 24
        run: pnpm check-input-privacy
