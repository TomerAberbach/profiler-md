[package]
name = "json_bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "json_bench"
path = "src/profile.rs"

[dependencies]
serde_json = "=1.0.140"
pprof = { version = "=0.13.0", features = ["prost-codec", "frame-pointer"] }
prost = "0.12"

[profile.release]
debug = true
codegen-units = 1
